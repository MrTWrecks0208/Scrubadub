<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>
  
  <!-- Stylized Regex / Text Scrub Wave & Sparkle -->
  <path d="M14 22H28M14 32H38M14 42H26" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M28 22H36" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 4"/>
  
  <!-- Magic Brush / Sparkle -->
  <path d="M42 16L48 22L32 38L26 38L26 32L42 16Z" fill="url(#accent)"/>
  <circle cx="48" cy="16" r="3" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="52" cy="24" r="1.5" fill="#C084FC"/>
  <circle cx="40" cy="12" r="1.5" fill="#38BDF8"/>
</svg>
